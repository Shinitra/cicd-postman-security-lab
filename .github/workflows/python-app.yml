name: CI/CD Security Lab
on: [push, pull_request]

jobs:
test:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: "3.12"
- name: Install dependencies
run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pytest bandit pip-audit
- name: Run tests
run: pytest
- name: Run Bandit SAST scan
run: python -m bandit -r . -f txt --exclude test_app.py
- name: Run dependency scan
run: python -m pip_audit -r requirements.txt
- name: Build application package
run: python -m zipfile -c build.zip app.py requirements.txt README.md

